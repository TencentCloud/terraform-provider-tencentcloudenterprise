name: Validate Documentation

on:
  pull_request:
    paths:
      - 'tencentcloud/**'
      - 'gendoc/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/generate-docs.yml'

permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'gendoc/go.mod'
          cache: true

      - name: Build and run gendoc
        run: |
          cd gendoc
          go build -o gendoc .
          ./gendoc

      - name: Check documentation is up to date
        run: |
          if git diff --quiet docs/; then
            echo "Documentation is up to date."
          else
            echo "::error::Documentation is out of date. Please run 'make doc' locally and commit the changes."
            echo ""
            echo "Changed files:"
            git diff --stat docs/
            echo ""
            echo "Diff details:"
            git diff docs/
            exit 1
          fi
